# そういえば。 Worker 設定
# name は手元（wrangler dev）と dry-run 用。配備は scripts/deploy.sh（pnpm run deploy）が .wrangler/worker-name の
# 乱数の名前を --name で渡す（ADR-0016。souieba.<account>.workers.dev は推測できる URL になるので使わない）
name = "souieba"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]  # @anthropic-ai/sdk のため
preview_urls = false  # バージョンごとの Preview URL（<id>-<name>.<account>.workers.dev）を出さない

# 画面（web/dist）は同じ Worker から配信する。/api/* だけ Worker のコードが先に処理する。
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 秘密でない設定。秘密（ANTHROPIC_API_KEY, INVITE_CODE, JWT_SECRET）は wrangler secret put で入れる。
# ローカルでは .dev.vars が上書きする（ENVIRONMENT=development など）。
[vars]
ENVIRONMENT = "production"
ANTHROPIC_MODEL = "claude-opus-5-5"   # コスト優先なら claude-sonnet-5-5（ADR-0005）
APP_VERSION = "0.1.0"

[[d1_databases]]
binding = "DB"
database_name = "souieba"
database_id = "00000000-0000-0000-0000-000000000000"  # wrangler d1 create souieba の出力で置き換える
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "souieba-photos"

[observability]
enabled = true
