<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- 拡大しないページにする（ADR-0011 の 5 節）。WKWebView は拡大できる指定のままだと、ダブルタップで本文に寄って拡大する
         （touch-action: manipulation だけでは実機で止まらなかった）。ピンチはもともと Capacitor が止めている（zoomEnabled = false）ので、
         この指定で取り上げるものは無い。Safari は user-scalable=no を無視するので、ブラウザでの開発ではピンチできるまま -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF5EC" />
    <!-- 地は明るい紙だけ（ADR-0011）。端末が暗い表示でも、入力欄・日付の選択・スクロールバーを明るい紙のまま描く -->
    <meta name="color-scheme" content="light" />
    <!-- 書いたひとことの中の数字や住所を、電話番号・地図・メールのリンクに変えない（自分の言葉は書いたままに見せる） -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <!-- 審査員向けの配備（ADR-0016）: 検索に載せない。字体を取りに行くときなど、外に Referer（ページの場所）を送らない
         （字体のファイルは CORS で取るので、ホスト名だけは Origin として相手に届く） -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <title>そういえば。</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体の CSS は描画を止めない読み方にする（print で読み、届いたら all に切り替える）。届くまでは端末の字体
         （iOS ではヒラギノ丸ゴ / 角ゴ / 明朝）で出し、通信が無くても画面が白いまま待たない。
         Zen Old Mincho は書いた言葉と引用の明朝（ADR-0010）。unicode-range で分かれているので、使う字の分だけ届く -->
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500&family=Zen+Old+Mincho:wght@500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
