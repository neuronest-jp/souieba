name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:hook
      - run: pnpm check:words
      - run: pnpm typecheck
      - run: pnpm test
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
      - run: pnpm build
