# そういえば。 Worker 設定
name = "souieba"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"

# 画面（web/dist）は同じ Worker から配信する。/api/* だけ Worker のコードが先に処理する。
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 秘密でない設定。秘密（ANTHROPIC_API_KEY）は wrangler secret put で入れる。
# ローカルでは .dev.vars が上書きする（ENVIRONMENT=development など）。
[vars]
ENVIRONMENT = "production"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
ACCESS_TEAM_DOMAIN = ""   # 例: "example" （https://example.cloudflareaccess.com）
ACCESS_AUD = ""           # Access アプリケーションの AUD タグ
APP_VERSION = "0.1.0"

[[d1_databases]]
binding = "DB"
database_name = "souieba"
database_id = "00000000-0000-0000-0000-000000000000"  # wrangler d1 create souieba の出力で置き換える
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "souieba-photos"

[observability]
enabled = true
